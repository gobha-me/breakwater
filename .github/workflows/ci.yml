name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs cancel. Main and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  light:
    name: format, lint and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install light tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
          python -m pip install gdtoolkit==4.5.0 PyYAML==6.0.3

      - name: Check C++ formatting
        env:
          CLANG_FORMAT: clang-format-20
        run: tools/format.sh --check

      - name: Lint and format-check GDScript
        run: tools/gdlint.sh

      - name: Guard workflow policy and exercise rejection cases
        run: |
          python3 tools/workflow_check.py
          python3 tools/test_workflow_check.py
